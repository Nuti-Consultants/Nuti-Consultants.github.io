<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Nuti Consultants</title>
    <link rel="stylesheet" href="assets/css/main.css" />
      <script>(function(){
var D=document.documentElement;
try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')D.setAttribute('data-theme',t);}catch(e){}
function cur(){var a=D.getAttribute('data-theme');if(a)return a;
return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
document.addEventListener('DOMContentLoaded',function(){
var host=document.querySelector('.header-inner')||document.querySelector('#sidebar .inner')
||document.querySelector('#header nav.links')||document.querySelector('#header');
if(!host||host.querySelector('.theme-toggle'))return;
var b=document.createElement('button');
b.type='button';b.className='theme-toggle';
b.innerHTML='<svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>'
+'<svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function sync(){var c=cur();b.setAttribute('aria-label',c==='dark'?'Switch to light theme':'Switch to dark theme');
b.setAttribute('title',b.getAttribute('aria-label'));}
sync();
b.addEventListener('click',function(){var n=cur()==='dark'?'light':'dark';
D.setAttribute('data-theme',n);try{localStorage.setItem('theme',n);}catch(e){}sync();});
host.appendChild(b);});})();</script>
  </head>
  <body>
    <main class="section">
      <div class="container">
        <h1>Page not found</h1>
        <p>The page you’re looking for doesn’t exist.</p>
        <p><a class="btn" href="/">Go to homepage</a></p>
      </div>
    </main>
  </body>
  </html>
